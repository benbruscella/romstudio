name: Check, build and deploy

# Pull requests carry the full verification (docs/BUILD.md#ci-pull-requests-and-main):
# checks, unit tests, the verified build of all six games and the integration
# tests. A merge to main builds the verified site again for the merged commit
# and deploys it. The site works at any address; the custom domain is a
# GitHub Pages setting, not part of the build.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Keep main builds in order so an older, slower recovery cannot publish after
# a newer merge. GitHub retains the newest pending run in this group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Source checks and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test -- unit
      - name: Note for pull requests from forks
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo "::notice title=Verification skipped::Pull requests from forks cannot read MEDIA_KEY, so the verified build and integration tests run only for branches in this repository."

  verify:
    name: Verify games, build site and run integration tests
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/verified-build
        with:
          media-key: ${{ secrets.MEDIA_KEY }}
      # After the build, so ROM Desk's stepping checks run on these packages.
      - name: Test real-media recovery, delivery and ROM Desk stepping
        run: npm test -- integration

  build:
    name: Verify games and build site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/verified-build
        with:
          media-key: ${{ secrets.MEDIA_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages must publish from GitHub Actions, not a branch. Workflows can
      # read but not change that setting; `npm run cli -- deploy-setup` does.
      - name: Check Pages publishes from GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type || true)
          if [ "$source" != "workflow" ]; then
            echo "::error title=Pages source::GitHub Pages publishes from '$source', not GitHub Actions. Run npm run cli -- deploy-setup. See docs/BUILD.md#ci-pull-requests-and-main."
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v5
        id: deployment
