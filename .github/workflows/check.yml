name: Check, build and deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Keep main builds in order so an older, slower recovery cannot publish after
# a newer merge. GitHub retains the newest pending run in this group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Source checks and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test -- unit

  build:
    name: Verify original games and build site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The pinned inputs are committed encrypted; MEDIA_KEY opens them. Both
      # come from `npm run cli -- deploy-setup` (docs/BUILD.md).
      - name: Verify and restore media by recipe identity
        env:
          MEDIA_KEY: ${{ secrets.MEDIA_KEY }}
        run: |
          if [ ! -f ci/rom-studio-media.sealed ] || [ -z "$MEDIA_KEY" ]; then
            echo "::error title=Missing game inputs::Run npm run cli -- deploy-setup on a machine with the original media, then commit ci/rom-studio-media.sealed. See docs/BUILD.md#ci-on-merge-to-main."
            exit 1
          fi
          npm run cli -- media import ci/rom-studio-media.sealed
      # Until the custom domain's DNS is live, build for the project URL
      # (https://<owner>.github.io/<repo>/). Set the repository variable
      # PAGES_DOMAIN (for example romstud.io) to build for the domain root.
      - name: Build verified static site
        env:
          PAGES_DOMAIN: ${{ vars.PAGES_DOMAIN }}
        run: |
          if [ -n "$PAGES_DOMAIN" ]; then
            npm run build -- --deploy --domain "$PAGES_DOMAIN"
          else
            npm run build -- --deploy --base "/${GITHUB_REPOSITORY#*/}/"
          fi
      # After the build, so ROM Desk's stepping checks run on these packages.
      - name: Test real-media recovery, delivery and ROM Desk stepping
        run: npm test -- integration
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages must publish from GitHub Actions, not a branch. Workflows cannot
      # change that setting; `npm run cli -- deploy-setup` does (once).
      - name: Check Pages publishes from GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type || true)
          if [ "$source" != "workflow" ]; then
            echo "::error title=Pages source::GitHub Pages publishes from '$source', not GitHub Actions. Run npm run cli -- deploy-setup. See docs/BUILD.md#ci-on-merge-to-main."
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v5
        id: deployment
