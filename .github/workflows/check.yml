name: Check, build and deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Keep main builds in order so an older, slower recovery cannot publish after
# a newer merge. GitHub retains the newest pending run in this group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Source checks and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test -- unit

  build:
    name: Verify original games and build site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fetch pinned game inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/ci-inputs
          if ! gh release download build-inputs --repo "$GITHUB_REPOSITORY" --pattern rom-studio-media.json.gz --dir dist/ci-inputs; then
            echo "::error title=Missing game inputs::Create the build-inputs release once from a machine with the original media: npm run cli -- media bundle, then gh release create build-inputs dist/work/rom-studio-media.json.gz --title 'Build inputs' --notes 'Pinned game inputs for CI'. See docs/BUILD.md#ci-on-merge-to-main."
            exit 1
          fi
      - name: Verify and restore media by recipe identity
        run: npm run cli -- media import dist/ci-inputs/rom-studio-media.json.gz
      # Until the custom domain's DNS is live, build for the project URL
      # (https://<owner>.github.io/<repo>/). Set the repository variable
      # PAGES_DOMAIN (for example romstud.io) to build for the domain root.
      - name: Build verified static site
        env:
          PAGES_DOMAIN: ${{ vars.PAGES_DOMAIN }}
        run: |
          if [ -n "$PAGES_DOMAIN" ]; then
            npm run build -- --deploy --domain "$PAGES_DOMAIN"
          else
            npm run build -- --deploy --base "/${GITHUB_REPOSITORY#*/}/"
          fi
      # After the build, so ROM Desk's stepping checks run on these packages.
      - name: Test real-media recovery, delivery and ROM Desk stepping
        run: npm test -- integration
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages must publish from GitHub Actions (not a branch), with the custom
      # domain set in repository settings: Actions deployments ignore CNAME.
      # Changing these needs a repository admin token, stored as the secret
      # PAGES_ADMIN_TOKEN (fine-grained: Administration and Pages, read and
      # write, on this repository). Without it, set them once by hand.
      - name: Configure Pages source and custom domain
        env:
          GH_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN }}
          PAGES_DOMAIN: ${{ vars.PAGES_DOMAIN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning title=Pages settings not automated::Add the PAGES_ADMIN_TOKEN secret, or set Settings → Pages → Source to GitHub Actions (and the custom domain) by hand. See docs/BUILD.md#romstudio-and-github-pages."
            exit 0
          fi
          args=(-f build_type=workflow)
          if [ -n "$PAGES_DOMAIN" ]; then
            args+=(-f cname="$PAGES_DOMAIN")
          fi
          gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" "${args[@]}"
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v5
        id: deployment
